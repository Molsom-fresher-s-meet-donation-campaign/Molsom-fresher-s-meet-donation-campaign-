<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molsom Language Learning</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Molsom Language Learning</h1>
<p>Learn vocabulary, phrases and basic grammar.</p>
</header>
<section class="card">
<h2>Word of the Day</h2>
<p id="word">Hello</p>
<button onclick="nextWord()">Next Word</button>
</section>
<section class="card">
<h2>Quick Quiz</h2>
<p>What is the translation of 'Hello'?</p>
<input id="answer" placeholder="Type answer">
<button onclick="checkAnswer()">Submit</button>
<p id="result"></p>
</section>
<script src="script.js"></script>
</body>
</html>
